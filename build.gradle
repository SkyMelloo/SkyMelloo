plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = 'QuiltMC'
		url = 'https://maven.quiltmc.org/repository/release/'
	}
	maven {
		name = 'Hypixel'
		url = 'https://repo.hypixel.net/repository/Hypixel/'
	}
	flatDir {
		dirs 'libs'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"skymelloo" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu integration so the config screen is reachable without a keybind.
	// Compiled against the jar the user already has installed (TerraformersMC's maven was down at build time).
	implementation ":modmenu:${project.modmenu_version}"

	// MellooEssentials - the shared core mod SkyMelloo now depends on for cosmetics and a handful of
	// generic utility classes (see fabric.mod.json's hard "mellooessentials" depends entry). Same
	// local-jar pattern as modmenu above - the built jar lives in libs/, no Maven publishing.
	implementation ":mellooessentials:${project.mellooessentials_version}"

	// Party detection via Hypixel's official Mod API. The actual networking bridge is provided
	// at runtime by the separately-installed HypixelModAPI mod; we only need the packet/API classes here.
	implementation "net.hypixel:mod-api:${project.hypixel_modapi_version}"
}

// "test" (-PtestBuild): anyone, never signed/registered. "dev": needs the maintainer's private
// key (see signAndRegisterBuild below). "public": not a build-time concept - an existing "dev"
// build gets promoted via the website admin panel. buildType itself is just a cosmetic marker
// baked into fabric.mod.json (readable via ModVersionManager) - server trust only comes from
// SignAndRegister.java's actual signature, not this flag.
def buildType = project.hasProperty('testBuild') ? 'test' : 'dev'

// Target deployment for the jar and the scripts that register it - -PsiteUrl beats the committed default.
def siteUrl = (project.findProperty('siteUrl') ?: project.site_url).toString().replaceAll('/+$', '')
def productionUrl = 'https://sky.melloo.me'

processResources {
	def version = project.version
	def publicVersion = project.public_version
	inputs.property "version", version
	inputs.property "publicVersion", publicVersion
	inputs.property "buildType", buildType
	inputs.property "siteUrl", siteUrl

	filesMatching("fabric.mod.json") {
		expand "version": version, "publicVersion": publicVersion, "buildType": buildType, "siteUrl": siteUrl
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Reports this build's version + jar hash to sky.melloo.me for admin-visible build tracking - see
// scripts/report-build.js. Informational only, never fails the build.
tasks.register('reportBuild', Exec) {
	group = 'skymelloo'
	description = 'Reports this build\'s version + jar hash to sky.melloo.me (informational, never fails the build).'
	dependsOn tasks.named('jar')
	ignoreExitValue = true
	environment 'SKYMELLOO_SITE_URL', siteUrl
	commandLine 'node', "${projectDir}/scripts/report-build.js", project.version.toString(), tasks.named('jar').get().archiveFile.get().asFile.absolutePath
}

// Every build must include a changelog - a hard gate (unlike reportBuild/signAndRegisterBuild/
// uploadJar's non-fatal error handling), throws and stops the build if neither property is
// provided. Prefer -PchangelogFile for anything beyond a trivial one-liner - -Pchangelog with
// special characters/multi-line text gets mangled by gradlew.bat's cmd.exe re-invocation.
def resolveChangelogText = {
	if (project.hasProperty('changelogFile')) {
		return new File(project.property('changelogFile').toString()).text
	}
	return project.findProperty('changelog')
}

// Without the signing key, a "dev" build attempt fails outright here instead of silently
// completing without ever actually registering (signAndRegisterBuild's own error handling is
// non-fatal, which would otherwise look like success). Property is "testBuild", not "test" -
// Gradle's hasProperty('test') is also true just from the built-in "test" task existing.
tasks.register('requireSigningKeyForDevBuild') {
	group = 'skymelloo'
	description = 'Fails the build if attempting a "dev" build (no -PtestBuild) without the maintainer\'s own signing key present.'
	doLast {
		if (project.hasProperty('testBuild')) {
			return
		}
		def keyFile = new File(System.getProperty("user.home"), ".skymelloo-signing/private_key.pem")
		if (!keyFile.exists()) {
			throw new GradleException(
				"Can't build \"dev\" - that requires the maintainer's own signing key, which isn't on this " +
				"machine. Add -PtestBuild instead (e.g. ./gradlew build -PtestBuild=true, or node scripts/build.js) - " +
				"a test build needs no key or verification at all."
			)
		}
	}
}

tasks.register('requireChangelog') {
	group = 'skymelloo'
	description = 'Fails the build if no changelog was provided via -Pchangelog or -PchangelogFile (skipped entirely for -PtestBuild builds).'
	dependsOn tasks.named('requireSigningKeyForDevBuild')
	doLast {
		if (project.hasProperty('testBuild')) {
			return // test builds are never registered as a real release, so there's nothing to log
		}
		def text = resolveChangelogText()
		if (!text || text.toString().trim().isEmpty()) {
			throw new GradleException(
				"Missing changelog! Every build must include one now - run with " +
				"-PchangelogFile=path/to/changelog.txt (recommended) or -Pchangelog=\"short one-liner\"."
			)
		}
	}
}

// Signs and registers this build as a trusted release - see scripts/SignAndRegister.java for the
// actual hashing/signing. Never fails over a network/IO problem, but does fail if requireChangelog
// above didn't already stop it first.
tasks.register('signAndRegisterBuild', Exec) {
	group = 'skymelloo'
	description = 'Signs this build\'s own class hash with the local private key and registers it as a trusted release, with its changelog (never fails the build over network/IO issues, but requires -Pchangelog). Skipped entirely for -PtestBuild builds.'
	dependsOn tasks.named('jar'), tasks.named('requireChangelog')
	ignoreExitValue = true
	onlyIf { !project.hasProperty('testBuild') }
	environment 'SKYMELLOO_SITE_URL', siteUrl
	doFirst {
		def text = resolveChangelogText()
		def tmpFile = new File("${buildDir}/changelog-arg.txt")
		tmpFile.parentFile.mkdirs()
		tmpFile.text = text.toString()
		// Passed as a file path, not a raw arg, to avoid the same cmd.exe mangling issue above.
		commandLine 'java', "${projectDir}/scripts/SignAndRegister.java", project.version.toString(), tasks.named('jar').get().archiveFile.get().asFile.absolutePath, tmpFile.absolutePath
	}
}

// Uploads this build's jar so it's downloadable from the admin panel right away - see
// scripts/upload-jar.js. Never fails the build.
tasks.register('uploadJar', Exec) {
	group = 'skymelloo'
	description = 'Uploads this build\'s jar to sky.melloo.me for admin download (never fails the build).'
	dependsOn tasks.named('jar')
	ignoreExitValue = true
	environment 'SKYMELLOO_SITE_URL', siteUrl
	commandLine 'node', "${projectDir}/scripts/upload-jar.js", project.version.toString(), tasks.named('jar').get().archiveFile.get().asFile.absolutePath
}

// gradle.properties is committed, so its site_url is what everyone else's download points at.
tasks.register('requireProductionSiteInRepo') {
	group = 'skymelloo'
	description = 'Fails the build if the committed site_url has been pointed away from production.'
	doLast {
		def committed = project.site_url.toString().replaceAll('/+$', '')
		if (committed != productionUrl) {
			throw new GradleException(
				"site_url in gradle.properties is \"${committed}\", but that file is committed and decides where " +
				"everyone else's download points. Set it back to ${productionUrl} and pass your own target per " +
				"build instead: ./gradlew build -PsiteUrl=${committed}"
			)
		}
	}
}

tasks.named('processResources') {
	dependsOn tasks.named('requireProductionSiteInRepo')
	doLast {
		if (siteUrl != productionUrl) {
			logger.lifecycle("[site] This build targets ${siteUrl}, not production - it registers there and must not be shared.")
		}
	}
}

tasks.named('build') {
	finalizedBy tasks.named('reportBuild')
	finalizedBy tasks.named('signAndRegisterBuild')
	finalizedBy tasks.named('uploadJar')
}
