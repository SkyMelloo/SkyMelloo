# extracted into a new shared SkyMellooButtonWidget (com.melloo.skymelloo.client.gui) so every
# screen can use the same pink-glow custom button - the Settings screen's Report a Bug button
# (added in 0.17.4) was accidentally the one place still using vanilla Minecraft's grey button.
# Bumped 0.17.6 -> 0.18.0 (minor, not patch) 2026-07-30: real new feature, not a bugfix - new "/sm
# link" command, the mirror image of "/skymelloo verify <code>". Instead of generating a code on the
# website and typing it in-game, this generates a token in-game and opens
# sky.melloo.me/link/<token> directly in the system browser, where it completes automatically using
# whatever Discord session is already there (or prompts a fresh login first) - no code to type at
# all. New server endpoints: POST /api/mod/link/start, GET /api/account/link/token/:token, POST
# /api/account/link/token/:token/complete (see website's new lib/modLink.js).
# Bumped 0.18.0 -> 0.19.0 (minor, not patch): Chest Highlight and Item Highlighting no longer show
# through walls - both now require an actual clear line of sight (real block raycast, see the new
# VisibilityUtil#hasLineOfSight, gated in EspManager#shouldGlow), so a chest/item is only highlighted
# once the marker is actually in view. Party/staff player highlighting is now scoped to SkyBlock only
# (previously applied on any Hypixel game mode). Removed the last of the dead per-feature permission
# gating (PermissionsManager.has() is a no-op returning true for everything except "cosmetics") -
# every remaining call site that still wrapped a feature behind it now runs unconditionally. The
# maintainer name shown in a couple of chat messages (/sm legal failure, unofficial-build notice) is
# now fetched live from the server instead of hardcoded.
# Bumped 0.19.0 -> 0.19.1 (patch): real bugfix - EspManager#isEspTarget (used for the colored
# nametag/distance-display path, separate from shouldGlow's outline path) was missing the same
# SkyBlock-only restriction shouldGlow already got, so a real vanilla-invisible party/staff member
# could still be revealed on non-SkyBlock game modes. Now gated the same way in both places.
# Bumped 0.19.1 -> 0.20.0 (minor, not patch): the mod is now Hypixel-only in general - the whole
# tick loop (party/friends/cloud sync/dungeons/cosmetics/whitelist+version+permission checks/etc.)
# is gated behind the new HypixelDetector.isHypixel(client) (extracted from PartyTracker's own
# internal check) and simply doesn't run at all when connected to any other server. The one
# exception is the new StaffEncounterTracker, which keeps scanning the tab list everywhere,
# specifically so real SkyMelloo staff/owner members are still recognized wherever encountered.
# New command "/sm hitstaff" lists every staff/owner member you've ever been seen alongside, most
# recently seen first (server-side log, see the website's new lib/staffEncounters.js and the two
# new /api/mod/staff-encounters routes).
# Bumped 0.20.0 -> 0.21.0 (minor, not patch): Cloud Sync is now automatic once the account is
# linked, no separate toggle anymore. Once per launch it checks link status directly, pulls
# whatever's already saved in the cloud if anything is, or - if nothing's been saved yet - pushes
# this device's current settings up so whichever device links first doesn't lose what it already
# had. From then on it behaves as before: push on every settings-screen close, pull on the next
# launch/device. Removed the old "skip if this device already has a local config" safety check -
# account-linking is now the only gate that matters.
# Bumped 0.21.0 -> 0.22.0 (minor, not patch): reworked Cloud Sync again after a data-protection
# concern - re-added the explicit opt-in toggle (cloudSyncEnabled, off by default) alongside account
# linking, since linking alone isn't real consent to sync settings data. Sync direction is now
# timestamp-based (this device's settings-file mtime vs. the cloud copy's own updatedAt, both now
# returned by GET /api/mod/settings) instead of always preferring one side. When both a local file
# and a cloud copy genuinely exist, it no longer guesses at all - a new CloudSyncChoiceScreen pops
# up showing exactly when each was last saved and lets the player pick Local or Cloud explicitly.
mod_version=0.22.0

# PUBLIC VERSIONING: mod_version above is the INTERNAL/dev version - it bumps on every single
# change, same day, multiple times, purely so every build has a unique identity for
# signing/integrity/compatibility checks. It was never meant to be a user-facing release number.
# public_version below is a completely separate, independent counter - only bumped by hand, only
# when a build is actually published to the public, starting at 0.0.1 for the first public release.
# Baked into fabric.mod.json's custom "skymelloo:publicVersion" field (see build.gradle's
# processResources) so "/sm version" can show both: the public version (what end users/the
# changelog call it) and the internal dev version alongside it (so a dev can always map a user's
# report back to the exact internal build). See ModVersionManager#getPublicVersion(). The website's
# release registry (lib/modReleases.js) separately tracks its own publicVersion per registered
# release, set at build-registration time and correctable afterward via the admin panel - this is
# what the /download and /changelog pages actually display, never the internal dev version.
public_version=0.0.1
maven_group=com.melloo
archives_base_name=skymelloo

# Dependencies
fabric_api_version=0.155.2+26.1.2
yacl_version=3.9.4+26.1-fabric
modmenu_version=18.0.0
hypixel_modapi_version=1.0.2
