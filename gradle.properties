# Bumped 0.8.1 -> 0.8.2 (patch) 2026-07-27: real regression fix - the live dungeon map's player
# marker had gone back to visibly snapping instead of gliding smoothly.
# Root cause: the position-history report cadence had drifted to a 1s "drain only what's new since
# last report" send, so a single delayed/dropped report left a genuine gap the website's render
# pointer could fall into. Restored the original working design: reports now go
# out every 0.5s (ModPresenceManager#REPORT_INTERVAL_TICKS) and each one resends the last 1s of
