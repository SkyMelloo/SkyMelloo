# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
# Versioning scheme (set 2026-07-26): PATCH (3rd number) for small bugfixes, MINOR (2nd number,
# patch reset to 0) for bigger added features, MAJOR (1st number) only ever bumped on explicit
# instruction. Bumped 0.0.0 -> 0.1.0 the same day after a whole batch of real features shipped
# (room grouping on the map, non-mod-user position reporting, redesigned cosmetics, the mod
# signing/integrity system, /sm info+version, etc.) without ever actually bumping the version -
# this scheme must be applied on every future change from here on, not just remembered once.
# The backend checks this against a minimum-compatible version on join (see ModVersionManager) and
# separately nudges (without disabling anything) if it's merely behind the latest release - see
# MIN_CLIENT_VERSION/LATEST_CLIENT_VERSION in server.js, which must stay in lockstep with whatever's
# released here.
# Bumped 0.1.1 -> 0.2.0 (minor, not patch) for the ephemeral-keypair + per-request-signing mod-auth
# rewrite - a full wire-protocol replacement of ModAuthManager/SkyMellooApiClient's
# auth handshake, not a small bugfix.
# Bumped 0.2.0 -> 0.2.1 (patch) for two dungeon-tracker bugfixes: a "Run failed" debug
# HUD line for the local-death case, and a fallback that sends the end-of-run report when Hypixel's
# "Click HERE to re-queue" line never shows up (confirmed missing from a real log even after a
# genuine floor completion).
# Bumped 0.2.1 -> 0.2.2 (patch) same day: fixed a real health-bar bug (ActionBarTracker matched
# component.getString() instead of its own already-correct segment text, corrupting the health
# number - confirmed from a live "62901/2526" report), extended "Run failed" to also cover a full
# party wipe (not just the local player's own death), and fixed the website's room-merge/movement-
# smoothing issues (no mod-side change needed for those).
# Bumped 0.2.2 -> 0.2.3 (patch) same day: "Sync Interval (ticks)" in the Cloud tab was an
# intStepRow (4-100 in steps of 4 - up to 24 clicks to reach the high end), switched to intTextRow
# (click to type a value directly), matching the pattern other wide-range int settings already use.
# Bumped 0.2.3 -> 0.3.0 (minor, not patch) same day: real feature, not a bugfix - the mod now
# samples its exact dungeon position every client tick (20/s) and bundles the whole buffer into each
# presence report instead of one point per report, so the website can draw a real recorded path
# instead of smoothing/guessing between sparse points (see DungeonSyncManager#sampleTick, the
# server's lib/presence.js#mergePositionHistory accumulation, and app.js's markerHistory rendering).
# Bumped 0.3.0 -> 0.3.1 (patch) same day: cleanup only - removed the now-dead warn-only integrity
# branch in ModVersionManager now that the server actually hard-blocks an unverified build again
# (see server.js's matching comment). The enforcement itself is server-side and was already live
# against 0.3.0; this just removes unreachable code and clarifies the log/chat message.
# Bumped 0.3.1 -> 0.4.0 (minor, not patch) same day: real features - presence/dungeonSync report
# interval is now fixed at 1s (removed the "Sync Interval (ticks)" setting entirely, see
# SkyMellooConfig/ModPresenceManager's own comments on why a fixed interval fixed a real live/replay
# sync bug on the website side too), and death events now record a position + death number
# (DungeonRunTracker#DeathMarker) for the website's new death "X" markers on both the live map and
# replay.
# Bumped 0.4.0 -> 0.4.1 (patch) same day: small addition + a real bugfix - Score HUD now shows how
# many points are needed for the next grade (DungeonRunTracker#nextGrade,
# SkyMellooConfig#dungeonScoreShowNextGrade), and puzzle rooms solved on a retry (Hypixel doesn't
# always re-send "PUZZLE SOLVED!" for those - confirmed missing from a real log) no longer get stuck
# showing FAILED forever on the Score HUD/Run Report - SkyblockerBridge#getCurrentRoomClearState now
# reads the real dungeon-map checkmark icon as a fallback completion signal (DungeonRunTracker#
# checkPuzzleClearedViaSkyblocker, ticked from DungeonRoomTracker). Doesn't touch the permanent
# Skill-score fail penalty, which stays correct/unchanged - only the displayed outcome is corrected.
# Bumped 0.4.1 -> 0.4.2 (patch) same day: renamed "/sm debug mana" to "/sm debug hm-bar" and expanded
# its output to cover the whole pipeline, not just the raw actionbar segments - every parsed cur/max
# fraction labeled by position (health=0/mana=1), and the actual on-screen bar fill state (px filled
# out of the 120px bar, source used, absorption overflow, white "just lost" trail) read via new shared
# HealthManaBarsHud#computeHealthBarState/computeManaBarState methods, which the real renderer was
# refactored to call too - so the debug output can never drift from what's actually drawn.
# Bumped 0.4.2 -> 0.4.3 (patch) same day: mirrored the existing "damage trail" animation for GAINS
# too. A heal/mana-regen now shows the full new amount instantly as a red highlight
# block, while the real green/blue fill animates up to meet it at the same speed the loss-trail
# already fades down at (HealthManaBarsHud#risingHealthFraction/risingManaFraction, mirroring
# displayedHealthFraction/displayedManaFraction). /sm debug hm-bar reports this too.
# Bumped 0.4.3 -> 0.4.4 (patch) same day: real bugfix - the "hurry or S+ may no longer be possible!"
# time-limit checkpoint warnings fired purely off the floor's raw nominal par time, completely
# ignoring the run's REAL S+ margin (getExtraSecondsForSPlus) - confirmed from a real report: S+ was
# already comfortably secured (Skill/Explore/Bonus alone nearly covered 300) and the mod warned anyway
# at 60/30/15/10s remaining on the floor's own clock, directly contradicting its own Score HUD "extra
# time" display at the same moment. Checkpoints now gate on the real S+ margin instead, and a sudden
# drop in that margin (e.g. right after a puzzle fail) only announces the single most urgent checkpoint
# crossed instead of spamming one message per checkpoint.
# Bumped 0.4.4 -> 0.5.0 (minor, not patch) same day: real new feature, first prototype - the mod now
# scans real world blocks while in a boss room (the dungeon map item doesn't cover boss rooms at all,
# Hypixel swaps it for a Nether Star on entry) and delta-encodes them (BossRoomScanner, only ever
# sends a given block position once per encounter) into the dungeonSync report. The website
# accumulates this into a real navigable 3D voxel scene (Three.js, WASD+mouselook, polls for updates)
# at /dungeon/:username/boss-room - a first prototype of a navigable 3D environment for boss rooms.
# Blocks render as flat colours (Minecraft's own MapColor id/RGB values, decompiled from the game's own code -
# NOT real textures, deliberately avoiding bundling/redistributing Mojang's copyrighted texture files).
# Bumped 0.5.0 -> 0.5.1 (patch) same day: the boss-room 3D prototype failed silently with nothing in
# the log to diagnose from - added DebugLog output to BossRoomScanner (start/stop, periodic
# new-block counts) and a new "/sm debug bossroom" command (active state, origin, scanId, positions
# checked/queued) so the next attempt is actually diagnosable instead of silently failing. Also
# sends more of what the local Dungeon Debug/Score/Party HUDs already track to the website:
# per-door wither state (not just the aggregate count), the local-death/party-wipe
# "run failed" flags, and client fps + Hypixel ping (real server TPS has no reliable client-visible
# source, so that's deliberately NOT included - see DungeonSyncManager's own comment on why).
# Bumped 0.5.1 -> 0.5.2 (patch) same day: real bugfix - the live/recorded score
# was frozen at exactly 20+0+100+0=120 for ENTIRE runs regardless of real progress, across every
# tracked run/floor. Root cause not yet fixed (needs a live report to see which piece is actually
# wrong - see the new debugScoreInfo()/DungeonTabList#getAllLines() doc comments for the full
# reasoning) - this ships the DIAGNOSTICS to find out: SkyblockerBridge#ensureChecked's failure path
# now actually logs why (was completely silent before), and a new "/sm debug score" command dumps
# every input calculateScore() uses plus a scan of the WHOLE reconstructed tab list for "Completed
# Rooms" (not just the fixed line index 43 the real formula reads), so the next report shows exactly
# whether that index is wrong, empty, or Skyblocker's own score just isn't being used. Also fixed a
# smaller, confirmed website bug alongside this: the Blood Room tile/badge showed a confusing "Not
# yet" even for runs that never got anywhere near it - now hidden entirely until actually reached,
# matching how the Boss Room tile already worked.
# Bumped 0.5.2 -> 0.5.3 (patch) same day: real bugfix - the linked-account marker never showed on the
# local player's own nametag. AccountLinkedMarkerManager gated on
# ModPresenceManager#isAccountLinked(uuid), which only ever tracks
# OTHER nearby players reporting in via presence - it never contains the LOCAL player's own uuid, so
# your own nametag (visible to yourself in third person) could never show the pink-dye marker even
# with a linked account, regardless of it already showing correctly to OTHER SkyMelloo users looking
# at you. Now uses PermissionsManager#isAccountLinked() (a direct self-status check, no presence
# system involved) specifically when the entity being named is the local player.
# Bumped 0.5.3 -> 0.5.4 (patch) same day: real bugfix - the linked-account dye icon rendered with the
# wrong colour. The icon component itself had no explicit style, only its (normally unused) fallback
# glyph did, so a preceding colour code in the name (e.g. a Hypixel rank prefix) visibly bled into the icon's render.
# Both the icon and the connecting space now get an explicit style of their own, breaking that
# inheritance regardless of exactly which rendering path let it through.
# Bumped 0.5.4 -> 0.5.5 (patch) same day: removed the "Prefer Skyblocker Score" toggle entirely,
# Skyblocker's live score is now ALWAYS used when installed (unconditional), not opt-in. Our own
# calculateScore() estimate remains only as the fallback when Skyblocker genuinely isn't installed,
# and as the sole source of the Skill/Explore/Speed/Bonus breakdown (Skyblocker doesn't expose those
# individually) - NOT deleted outright, since removing it entirely would break both of those. Also
# removed the "[Skyblocker]" tag from the Score HUD line - redundant now that it's always the source
# when available.
# Bumped 0.5.5 -> 0.5.6 (patch) same day: "/sm debug bossroom" showed "Queued, not yet sent: 0" which
# only proves BossRoomScanner drained its LOCAL pending list into a report payload - never that the
# HTTP request carrying it actually reached the server (drainPendingJson doesn't put anything back on
# a failed send, so a failed report loses that batch silently either way). ModPresenceManager now
# tracks attempts/successes/failures specifically for reports that had ≥1 boss-room block, plus the
# last error message, and /sm debug bossroom now shows a distinct successful-sent count alongside the
# existing sent count.
# Bumped 0.5.6 -> 0.6.0 (minor, not patch) same day: real new feature, not a bugfix - tracks dungeon
# completion, not just the current catacombs level. A new independent "Floor Completion" Auto-Kick pair (min + max, mirroring
# the existing Floor Requirement pair) checks SummaryResult#highestFloor() - Hypixel's own REAL
# completion record - as opposed to the existing Floor Requirement check, which only ever verified
# current level-ELIGIBILITY, never actual past completion. Each of MP/Level, Floor Requirement, and
# Floor Completion (min and max each) is its own independent toggle with its own threshold/message/
# delivery, same established pattern - a party can enable any combination.
# Bumped 0.6.0 -> 0.6.1 (patch) 2026-07-27: auto-kick `/party kick` commands are now queued and
# spaced ~1.1s apart instead of fired instantly - Hypixel's own per-command cooldown was silently
# swallowing every kick after the first whenever two checks fired close together (screenshot:
# "Command Failed: This command is on cooldown!"). A failed kick (cooldown message detected) is
# requeued and retried after another full interval, not dropped. See PartyJoinWatcher.java.
# Bumped 0.6.1 -> 0.6.2 (patch) 2026-07-27: fabric.mod.json's description no longer leads with "mob
# ESP" - ESP is being phased out (planned removal, repurposed into cosmetic effects and dungeon-mob
# related tooling instead) so it shouldn't be the headline feature description anymore. No behavior
