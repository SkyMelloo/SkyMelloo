# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
# Versioning scheme: PATCH (3rd number) for small bugfixes, MINOR (2nd number, patch reset to 0)
# for bigger added features, MAJOR (1st number) only ever bumped on explicit instruction. The
# backend checks this against a minimum-compatible version on join (see ModVersionManager) and
# separately nudges (without disabling anything) if it's merely behind the latest release - see
# MIN_CLIENT_VERSION/LATEST_CLIENT_VERSION in server.js, which must stay in lockstep with whatever's
# released here. Full per-version history: see CHANGELOG.md, not here - this file only ever holds
# the CURRENT version plus a one-line note on the latest change.
# Bumped 0.37.3 -> 0.37.4: CHANGELOG.md readability pass - each entry now shows its patch/minor/
# major badge next to the version heading instead of buried in the prose, and multi-part entries
# that were originally "(1) ... (2) ... (3) ..." or real bullet lists in the old gradle.properties
# comments render as actual markdown lists again (a few had gotten flattened into run-on
# paragraphs during the original extraction). Also synced mellooessentials_version pin to 0.12.3.
# No functional change.
# Bumped 0.37.4 -> 0.37.5: reworded every remaining mention of the old internal highlighting
# terminology in README/CHANGELOG.md, and rewrote git history (force-pushed) to scrub it out of
# every past commit's file content, paths, and messages too - never actually used in current code,
# just leftover history text. No functional change.
# Bumped 0.37.5 -> 0.37.6: fixed self-contradictory wording that slipped into the 0.37.5 entry
# above during the history rewrite (its own text got swept up in the same word-substitution rule
# it was describing). No functional change.
# Bumped 0.37.6 -> 0.37.7: added GitHub issue templates (bug report, feature request) and a PR
# template under .github/ - closes out most of the repo's Community Profile checklist. Synced
# mellooessentials_version pin to 0.12.4. No functional change.
mod_version=0.37.7

# PUBLIC VERSIONING: mod_version above is the INTERNAL/dev version - it bumps on every single
# change, same day, multiple times, purely so every build has a unique identity for
# signing/integrity/compatibility checks. It was never meant to be a user-facing release number.
# public_version below is a completely separate, independent counter - only bumped by hand, only
# when a build is actually published to the public, starting at 0.0.1 for the first public release.
# Baked into fabric.mod.json's custom "skymelloo:publicVersion" field (see build.gradle's
# processResources) so "/sm version" can show both: the public version (what end users/the
# changelog call it) and the internal dev version alongside it (so a dev can always map a user's
# report back to the exact internal build). See ModVersionManager#getPublicVersion(). The website's
# release registry (lib/modReleases.js) separately tracks its own publicVersion per registered
# release, set at build-registration time and correctable afterward via the admin panel - this is
# what the /download and /changelog pages actually display, never the internal dev version.
public_version=0.0.1
maven_group=com.melloo
archives_base_name=skymelloo

# Dependencies
fabric_api_version=0.155.2+26.1.2
modmenu_version=18.0.0
hypixel_modapi_version=1.0.2
mellooessentials_version=0.12.4
