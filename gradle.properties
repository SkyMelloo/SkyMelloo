# Bumped 0.6.2 -> 0.6.3 (patch) 2026-07-27: build pipeline now also uploads this build's own jar to
# sky.melloo.me automatically (new uploadJar Gradle task, scripts/upload-jar.js) - a Dev build is
# already "Trusted" (passes integrity) the moment it's registered, but previously had no jar sitting
