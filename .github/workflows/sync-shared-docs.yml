name: Sync shared docs

# SkyMelloo is the canonical source for a few docs that are meant to read identically across the
# whole org (SECURITY.md, CODE_OF_CONDUCT.md - see each file's own header/no per-repo wording).
# Edit them here; this pushes the change out to MellooEssentials, developer-api, and api-client
# automatically. Everything else (README, CONTRIBUTING, CHANGELOG, etc.) is genuinely per-repo and
# stays out of this workflow on purpose.
#
# Needs a repo secret SYNC_TARGET_TOKEN: a token with Contents: write access to all three target
# repos (SkyMelloo/MellooEssentials, SkyMelloo/developer-api, SkyMelloo/api-client). The default
# GITHUB_TOKEN GitHub gives a workflow is scoped only to the repo it runs in and can't push to
# sibling repos, so a real token has to be created and added as a secret by hand - see this repo's
# Settings -> Secrets and variables -> Actions.

on:
  push:
    branches: [main]
    paths:
      - SECURITY.md
      - CODE_OF_CONDUCT.md
  workflow_dispatch: {} # manual re-run/backfill - e.g. right after SYNC_TARGET_TOKEN is first added

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [MellooEssentials, developer-api, api-client]
      fail-fast: false # one target repo failing (e.g. bad token scope) shouldn't block the others
    steps:
      - name: Checkout SkyMelloo (source)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: SkyMelloo/${{ matrix.repo }}
          token: ${{ secrets.SYNC_TARGET_TOKEN }}
          path: target

      - name: Copy shared docs and push if changed
        run: |
          cp source/SECURITY.md target/SECURITY.md
          cp source/CODE_OF_CONDUCT.md target/CODE_OF_CONDUCT.md

          cd target
          if git diff --quiet -- SECURITY.md CODE_OF_CONDUCT.md; then
            echo "No changes for ${{ matrix.repo }}, nothing to push."
            exit 0
          fi

          git config user.name "sky-melloo-sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add SECURITY.md CODE_OF_CONDUCT.md
          git commit -m "Sync SECURITY.md/CODE_OF_CONDUCT.md from SkyMelloo@${{ github.sha }}

          Automated - see https://github.com/SkyMelloo/SkyMelloo/blob/main/.github/workflows/sync-shared-docs.yml"
          git push origin HEAD:main
